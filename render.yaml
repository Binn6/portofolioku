services:
  - type: web
    name: portfolio-backend
    env: docker
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /up

  - type: cron
    name: finance-wallet-demo-reset
    env: docker
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    schedule: "0 17 * * *"
    dockerCommand: php artisan finance-wallet:reset
    plan: free
